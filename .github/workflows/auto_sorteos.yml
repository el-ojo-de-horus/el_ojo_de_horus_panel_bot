name: Actualizar Resultados Animalitos

on:
  schedule:
    # Cada hora de 12:05 UTC (08:05 AM Vzla) a 23:05 UTC (07:05 PM Vzla)
    - cron: '5 12-23 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 firebase-admin
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python actualizar_resultados.py
