name: Actualizar Lotería y Proyectar

on:
  schedule:
    - cron: '5 0 * * *'  # 8:05 PM Hora Venezuela (00:05 UTC)
  workflow_dispatch:      # Botón para ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin requests beautifulsoup4

      - name: Ejecutar Cerebro
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > firebase-credentials.json
          python cerebro.py
